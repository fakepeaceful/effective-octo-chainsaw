# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  INPUT FIELD CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ---------------------------
#  PASSWORD INPUT FIELD
# ---------------------------
input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2
    dots_text_format = •
    dots_size = 0.5
    dots_spacing = 0.1
    dots_center = true
    check_color = rgba(255, 0, 0, 0.6)
    outer_color = rgba(22,28,36,0.5)
    inner_color = rgba(22,28,36,0.5)
    font_color = rgba(194,199,202,0.8)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <span foreground="##6E7478">$USER</span>
    hide_input = false
    position = 0, -250
    halign = center
    valign = center
}



# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  LABELS CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ---------------------------
#  TIME
# ---------------------------
label {
    monitor =
    text = cmd[update:1000] sh ~/.config/hypr/hyprlock/scripts/current_time.sh
    color = rgba(245,248,250,1)
    font_size = 95
    font_family = JetBrains Mono Extrabold
    position = 0, 200
    halign = center
    valign = center
}

# ---------------------------
#  DATE
# ---------------------------
label {
    monitor =
    text = cmd[update:1000] sh ~/.config/hypr/hyprlock/scripts/current_date.sh
    color = rgba(138,160,176,1)
    font_size = 15
    font_family = JetBrains Mono Extrabold
    position = 0, 120
    halign = center
    valign = center
}

# ---------------------------
#  CURRENT SONG
# ---------------------------
label {
    monitor =
    text = cmd[update:1000] sh ~/.config/hypr/hyprlock/scripts/current_song.sh
    color = rgba(61,65,69,1)
    font_size = 12
    font_family = SF Pro Display Bold
    position = 0, -505
    halign = center
    valign = center
}


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  SETTINGS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ---------------------------
#  GENERAL SETTINGS
# ---------------------------
general {
    no_fade_in = false
    grace = 0
    immediate_render = true
    ignore_empty_input = true
    disable_loading_bar = false
    screencopy_mode = 0
    hide_cursor = true
}

# ---------------------------
#  BACKGROUND
# ---------------------------
background {
    monitor =
    path = ~/dots/wallpapers/Bridge.jpg
    blur_passes = 5
    blur_size = 1
    contrast = 1
    brightness = 0.8
    vibrancy = 1
    vibrancy_darkness = 0.0
}

# ---------------------------
#  ANIMATIONS
# ---------------------------
animation {
    enabled = true

    bezier = premiumSmooth, 0.2, 0, 0.25, 1

    animation = fadeIn, 1, 4, premiumSmooth
    animation = fadeOut, 1, 4, premiumSmooth
    animation = inputFieldDots, 1, 3, premiumSmooth
}
